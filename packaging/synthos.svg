<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!--
  Иконка Synthos: плоская коралловая плитка, жирная ромбовая монограмма S
  и искра генерации.

  Ни теней, ни свечений, ни фильтров: знак читается силуэтом, поэтому одинаково
  работает и на 512, и на 16 px, и на светлой панели, и на тёмной.

  Плитка squircle: суперэллипс |x/224|^4.3 + |y/224|^4.3 = 1 (тело 448x448 в
  канве 512), собранный из 16 кубических сегментов. У него непрерывная кривизна,
  в отличие от rect с rx, поэтому углы не «ломаются» на больших размерах.

  Коралл совпадает с переменной primary из styles/base/variables.mss (#EE5E48),
  градиент — лишь два стопа вокруг него, чтобы плитка не выглядела пластиком.

  Монограмма: две «чаши» с центрами (248,200) и (248,320), обе — суперэллипс
  радиуса 66 со степенью p=1.4. При p=2 это была бы окружность, при p=1 — ромб;
  1.4 даёт ромбовидный силуэт с мягкими углами. Каждая дуга собрана из восьми
  кубических сегментов: контрольные точки подобраны по касательной (нормаль к
  градиенту неявной функции) и середине дуги, поэтому кривая гладкая, а не
  гранёная. Обводка 58 с круглыми концами.

  Файл вшит в бинарь через include_bytes! в src/components/nav_rail.rs и
  src/pages/settings/about.rs, так что логотип в рейле и на странице
  «О программе» меняется вместе с иконкой, но только после cargo build.
-->
  <defs>
    <linearGradient id="synthos-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8264"/>
      <stop offset="1" stop-color="#E8503A"/>
    </linearGradient>
  </defs>

  <!-- плитка -->
  <path d="M 480.00 256.00 C 480.00 365.27 477.33 378.28 471.90 399.29 C 466.56 419.96 458.12 435.18 446.65 446.65 C 435.18 458.12 419.96 466.56 399.29 471.90 C 378.28 477.33 365.27 480.00 256.00 480.00 C 146.73 480.00 133.72 477.33 112.71 471.90 C 92.04 466.56 76.82 458.12 65.35 446.65 C 53.88 435.18 45.44 419.96 40.10 399.29 C 34.67 378.28 32.00 365.27 32.00 256.00 C 32.00 146.73 34.67 133.72 40.10 112.71 C 45.44 92.04 53.88 76.82 65.35 65.35 C 76.82 53.88 92.04 45.44 112.71 40.10 C 133.72 34.67 146.73 32.00 256.00 32.00 C 365.27 32.00 378.28 34.67 399.29 40.10 C 419.96 45.44 435.18 53.88 446.65 65.35 C 458.12 76.82 466.56 92.04 471.90 112.71 C 477.33 133.72 480.00 146.73 480.00 256.00 Z" fill="url(#synthos-bg)"/>

  <!-- ромбовая монограмма S -->
  <path d="M 293.1 158.9 C 283.8 148.7 273.3 140.0 263.5 134.3 C 252.3 127.8 248.2 127.6 244.4 128.8 C 237.3 131.0 227.3 136.7 216.8 145.5 C 206.5 154.2 197.2 164.6 190.7 174.7 C 183.7 185.5 181.7 192.8 182.2 195.3 C 183.4 201.0 188.1 210.6 196.3 221.2 C 204.3 231.6 214.5 241.3 224.8 248.7 C 235.0 256.0 244.7 260.0 248.0 260.0 C 251.3 260.0 261.0 264.0 271.2 271.3 C 281.5 278.7 291.7 288.4 299.7 298.8 C 307.9 309.4 312.6 319.0 313.8 324.7 C 314.3 327.2 312.3 334.5 305.3 345.3 C 298.8 355.4 289.5 365.8 279.2 374.5 C 268.7 383.3 258.7 389.0 251.6 391.2 C 247.8 392.4 243.7 392.2 232.5 385.7 C 222.7 380.0 212.2 371.3 202.9 361.1"
        fill="none" stroke="#FFFFFF" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- искра -->
  <path d="M 386 88 Q 399.8 120.2 432 134 Q 399.8 147.8 386 180 Q 372.2 147.8 340 134 Q 372.2 120.2 386 88 Z" fill="#FFFFFF"/>
</svg>
