<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- deep navy → near-black squircle background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F3A"/>
      <stop offset="1" stop-color="#0A0B16"/>
    </linearGradient>

    <!-- warm coral → magenta accent for the S-curve and the spark -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FFB36B"/>
      <stop offset="0.45" stop-color="#FF7A60"/>
      <stop offset="1"   stop-color="#D14B8F"/>
    </linearGradient>

    <!-- subtle highlight on the upper hemisphere -->
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.68">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- soft glow around the central spark -->
    <radialGradient id="spark-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFD2A8" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#FF7A60" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#glow)"/>

  <!-- thin border ring -->
  <rect x="33.5" y="33.5" width="445" height="445" rx="110.5" ry="110.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

  <!-- orbital ring — поворот, чтобы намекнуть на узлы / сеть -->
  <g transform="translate(256 256) rotate(-22)" fill="none" opacity="0.55">
    <ellipse cx="0" cy="0" rx="160" ry="60"
             stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>
  </g>

  <!-- три «узла» вдоль воображаемой орбиты -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="118" cy="186" r="3.5" opacity="0.55"/>
    <circle cx="404" cy="190" r="2.5" opacity="0.4"/>
    <circle cx="142" cy="346" r="2.5" opacity="0.45"/>
    <circle cx="396" cy="340" r="3"   opacity="0.55"/>
  </g>

  <!-- ─────── S-mark: две зеркальные кубические кривые, формирующие S -->
  <g filter="url(#soft-shadow)">
    <!-- внешний glow (тот же путь, размытый) -->
    <path d="M 332 178
             C 332 138, 286 124, 256 124
             C 220 124, 174 144, 174 192
             C 174 232, 218 248, 256 252
             C 294 256, 338 272, 338 312
             C 338 360, 292 380, 256 380
             C 226 380, 180 366, 180 326"
          fill="none"
          stroke="url(#accent)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.35"
          filter="url(#glow-blur)"/>

    <!-- сама S-кривая -->
    <path d="M 332 178
             C 332 138, 286 124, 256 124
             C 220 124, 174 144, 174 192
             C 174 232, 218 248, 256 252
             C 294 256, 338 272, 338 312
             C 338 360, 292 380, 256 380
             C 226 380, 180 366, 180 326"
          fill="none"
          stroke="url(#accent)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- внутренний highlight для объёма -->
    <path d="M 332 178
             C 332 138, 286 124, 256 124
             C 220 124, 174 144, 174 192"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.22"
          stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- центральный spark (точка синтеза) -->
  <g transform="translate(256 252)">
    <circle r="34" fill="url(#spark-glow)"/>
    <circle r="9"  fill="#FFFFFF"/>
    <circle r="5"  fill="#FFE3CC"/>
  </g>

  <!-- субтильная нижняя «аура» — три концентрические дуги -->
  <g transform="translate(256 432)" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M -72 0 A 72 16 0 0 1 72 0" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
    <path d="M -46 0 A 46 10 0 0 1 46 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M -22 0 A 22  6 0 0 1 22 0" stroke="url(#accent)" stroke-width="3"/>
  </g>
</svg>
