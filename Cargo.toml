[workspace]
resolver = "2"
members = ["."]

[workspace.package]
# Версия — 0.2.<номер сборки>, тег релиза v0.2.<номер>. Патч — сквозной номер
# сборки; приложение показывает её в заголовке — см. build.rs (SYNTHOS_VERSION).
# Выпуск: `syngui release <версия> --publish` (метаданные — [package.metadata.syngui]).
version = "0.2.322"
edition = "2021"
rust-version = "1.96"
authors = ["Alexeyev Vitaly"]
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
toml = "0.8"
tokenizers = "0.23.1"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
sqlite-vec = "0.1"

[package]
name = "synthos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local AI desktop studio — agentic chat, knowledge base, code editor and LoRA training on the native synaptix engine"
repository = "https://github.com/VitaminDB/synthos"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "synthos"
path = "src/main.rs"

[features]
default = ["desktop", "nvml", "kb-sqlite-vec", "engine", "cuda", "npu"]
# Встроенный движок: без запущенной службы synaptixd synthos поднимает тот же
# сервер (`synaptixd::server`) у себя в процессе — см. src/engine.rs.
engine = ["synaptixd/daemon"]
# Ускорители встроенного движка — как у системной службы (cuda — NVIDIA,
# npu — Intel); без них свой движок считает на процессоре.
cuda = ["engine", "synaptixd/cuda"]
npu = ["engine", "synaptixd/npu"]
desktop = ["syngui/clipboard"]
android = ["syngui/android"]
testing = ["syngui/testing"]
# NVML — GPU/VRAM-метрики на NVIDIA. На не-NVIDIA модуль gpu.rs остаётся
# собранным, но `try_new_nvml()` вернёт None → панель скрывается.
nvml = ["dep:nvml-wrapper"]

# sqlite-vec (vec0 virtual table) — KNN-индекс при коллекциях >100k чанков.
# Подключается через `kb::store::init_sqlite_vec()` (one-shot, регистрирует
# auto-extension). Без фичи KB продолжает работать на full-scan-cosine.
kb-sqlite-vec = ["dep:sqlite-vec"]

# doc-парсинг для KB — маркеры синхронны с synaptix-rag (cfg-gating в kb::ingest).
doc-processing-folder = ["synaptix-rag/doc-processing-folder"]
doc-processing-html = ["synaptix-rag/doc-processing-html"]
doc-processing-pdf = ["synaptix-rag/doc-processing-pdf"]

[dependencies]
syngui = { path = "../syngui/syngui", default-features = false, features = [
    "msdf",
    "effects",
    "winit",
    "wayland-dnd",
    # Системное оформление: light/dark и акцент из XDG-портала, кнопки окна из
    # темы декораций, размытие фона композитором.
    "system-theme",
    "system-blur",
    # Скринридеры (Orca и др.) через AccessKit/AT-SPI: дерево строится, только
    # когда скринридер подключён.
    "accessibility",
    "material-icons",
    "tokio",
    "markdown",
    "markdown-syntax",
    "image",
    "image-network",
    # Цветные эмодзи — панель эмодзи в чате.
    "color-emoji",
    "svg",
    "clipboard",
    "audio",
    "ffmpeg",
    "terminal",
    # Один экземпляр: повторный запуск поднимает окно и передаёт аргументы
    # (`synthos --open-terminal …`).
    "single-instance",
    "code-editor-all",
    "i18n",
] }

rand = "0.8"
hound = { workspace = true }
symphonia = { workspace = true }
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
# `env-filter` — позволяет переменной RUST_LOG динамически переопределить
# уровень. `ansi` — цвета в stderr (в файл выводим без ANSI).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
    "registry",
    "std",
] }
# Rolling file appender + non-blocking writer. Daily ротация в
# ~/.local/state/synthos/logs/synthos.log.<YYYY-MM-DD>; чтобы writer не
# блокировал hot-path при tracing! на slow filesystem — non-blocking
# (отдельный std::thread, batch flush'ит в фоне).
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frontmatter в файлах скилов (`~/.config/synthos/skills/*.md`).
toml = { workspace = true }
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }

synaptix-core = { path = "../synaptix/crates/synaptix-core" }
synassist = { package = "syn-assist", path = "../synshell/crates/syn-assist" }
# Заметки ведёт программа syn-notes (synshell): инструмент `notes` говорит с
# ней по сокету (syn-notes-proto). Из библиотеки syn-notes берутся только
# общие части: бюджет ответа инструментов, набор эмодзи панели чата и сбор
# ссылок заметок на вложения (чтобы чистка вложений их не удалила).
syn-notes = { path = "../synshell/crates/syn-notes" }
syn-notes-proto = { path = "../synshell/crates/syn-notes-proto" }
# Движок нейросетей: клиент (чат, генерация) и — с фичей `engine` —
# сам сервер, если системная служба synaptixd не запущена (src/engine.rs).
synaptixd = { path = "../synshell/crates/synaptixd", default-features = false }
synaptix-kernels-cpu = { path = "../synaptix/crates/synaptix-kernels-cpu" }
# tokenizer — ChatTemplate/SpecialTokens.
synaptix-tokenizer = { path = "../synaptix/crates/synaptix-tokenizer" }
# .syn-бандлы моделей базы знаний (эмбеддер, реранкер). sha256/blake3 —
# проверка контрольных сумм чанков (`with_sha256`/`with_blake3` без фич паникуют).
synaptix-bundle = { path = "../synaptix/crates/synaptix-bundle", features = ["sha256", "blake3"] }

# Фасад synaptix без движка (фича `engine` выключена): токенизатор и шаблон
# чата, разбор ответа, профиль сэмплинга, интерфейсы — модели исполняет служба.
synaptix = { path = "../synaptix/crates/synaptix", default-features = false }
# synaptix-rag — doc-парсинг (md/html/pdf) + chunking + gitignore-walk для KB
# (модуль `doc`). sqlite-vec не включаем: индекс KB на собственном synthos-стеке.
synaptix-rag = { path = "../synaptix/crates/synaptix-rag", default-features = false }

# HTTP-клиент к llama-server (llama::api)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
    "multipart",
] }
tokio = { version = "1", features = [
    "rt",
    "time",
    "macros",
    "sync",
    "process",
    "io-util",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
anyhow = { workspace = true }
bytes = "1"

# Конвертация HTML → Markdown для tool'а web (action=read). На html5ever,
# GFM-таблицы и code-блоки из коробки. Активно поддерживается, превосходит
# html2md по качеству вывода.
htmd = "0.5"

# Mozilla Readability port (pure Rust). Используется в tool web (action=read)
# для извлечения article-контента из HTML до конвертации в markdown:
# вырезает nav/footer/sidebar/реклама.
dom_smoothie = "0.16"

# CSS-селекторы по DOM (на html5ever) — парсинг SERP DuckDuckGo
# в tool web (action=search).
scraper = "0.20"

# URL — нужен для unwrap DDG-обёрток `/l/?uddg=…` (parse + query_pairs).
url = "2"
# Локальное смещение таймзоны для меток времени в ленте (`localtime_r`).
libc = "0.2"

# Кодирование query-string в URL поиска DDG.
urlencoding = "2"

# Multimodal attachments: sha256-CAS в blobs/, base64 для data: URL.
sha2 = "0.10"
base64 = "0.22"
# Для guess MIME картинки по байтам — переиспользуем уже подключённый image
# через syngui features (cdylib), но прямого доступа из synthos нет. Берём
# отдельно: легковесный.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }

# Системные метрики для панели «Детали» (CPU per-thread, RAM).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# File system watcher — детект внешних изменений в проектах редактора кода
# (git pull, другой редактор). Используется в `pages::code_editor::fs_watcher`.
# `macos_kqueue=false` — на macOS используется FSEvents (default).
notify = { version = "8", default-features = false, features = [
    "macos_fsevent",
] }
# Обход проекта с учётом .gitignore — watcher ставит подписки по каталогам
# сам (рекурсивный watch notify падает целиком на одном нечитаемом каталоге).
ignore = "0.4"

# Pure-Rust git: используется страницей `pages::code_editor::git_status`
# для подсветки изменённых/новых/удалённых файлов в TreeView (Zed-style
# decorations). default-features off — нам не нужен networking; явно
# включаем `sha1` (gix-hash требует hash-backend) и `status`-API (даёт
# `Repository::status()` итератор и под него dirwalk + index + diff).
gix = { version = "0.83", default-features = false, features = [
    "sha1",
    "status",
] }
# NVIDIA GPU/VRAM метрики. Опциональная — если библиотеки нет в системе,
# на рантайме `Nvml::init()` вернёт Err и модуль деградирует молча.
nvml-wrapper = { version = "0.10", optional = true }

# Локальное хранилище для KB-индексов (см. src/kb/store.rs). bundled — статически
# линкуется sqlite (без системной зависимости). blob — для сериализации
# embedding-векторов как BLOB. fts5 — встроен в bundled-sqlite.
rusqlite = { workspace = true }

# vec0 virtual table для KB при коллекциях >100k чанков. Опционально через
# feature `kb-sqlite-vec`. Подключается через `init_sqlite_vec()` в lib.rs
# (one-shot, sqlite3_auto_extension). См. src/kb/vector_index.rs.
sqlite-vec = { workspace = true, optional = true }

# HF tokenizers — для chunker'а в kb::ingest. Тот же крейт уже тянет
# embedding-модель через synaptix KB, поэтому компилируется один раз.
tokenizers = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
tempfile = "3.10"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

# Сборка, пакеты и выпуск — утилитой syngui (syngui-cli):
#   syngui package -f arch --install        пакет Arch и установка в систему
#   syngui release <версия> --publish       тег, релиз GitHub, PKGBUILD для AUR
# Значок — data/icons/synthos.svg, ярлык — data/synthos.desktop.
[package.metadata.syngui]
name = "Synthos"
description_en = "Local AI desktop studio: agentic chat that generates images, video, music and speech, knowledge base, code editor with terminals, LoRA training — native synaptix engine on any NVIDIA sm_80+ GPU"
docs = ["README.md", "LICENSE", "LICENSE-COMMERCIAL.md", "LICENSE-EXCEPTION.md"]

[package.metadata.syngui.linux]
# epoch=1: с 20.09 по 23.09.2026 версией был голый номер сборки (268…278), и без
# epoch pacman счёл бы 0.2.x откатом.
epoch = 1
arches = ["x86_64"]
# synthos path-зависит на соседние syngui, synaptix и synshell — -git кладёт их рядом.
git_sources = [
    "syngui::git+https://github.com/VitaminDB/syngui.git",
    "synaptix::git+https://github.com/VitaminDB/synaptix.git",
    "synshell::git+https://github.com/VitaminDB/synshell.git",
]
# build.rs форка cudarc вызывает nvcc.
build_env = ["PATH=/opt/cuda/bin:$PATH"]
# ffmpeg по soname: мажорное обновление меняет soname, и pacman ловит
# рассинхрон вместо падающего бинарника.
depends = [
    "alsa-lib", "fontconfig", "vulkan-icd-loader", "libxkbcommon", "wayland", "gtk3",
    "libavutil.so=61-64", "libavcodec.so=63-64", "libavformat.so=63-64",
    "libswscale.so=10-64", "libswresample.so=7-64",
]
optdepends = [
    "nvidia-utils: нейросети на видеокарте NVIDIA (драйвер CUDA грузится в рантайме)",
    "cuda: компилятор ядер NVRTC — ядра собираются на лету под карту (sm_80+)",
    "openvino-intel-npu-plugin: нейросети на Intel NPU",
    "intel-npu-driver: драйвер Intel NPU",
    "intel-npu-compiler: компилятор моделей для Intel NPU",
    "synaptix: системная служба synaptixd — synthos делит с ней загруженные модели; без неё работает встроенный движок",
    "synshell-ai: ассистент synshell — ставит службу synaptix, с которой synthos делит модели",
]
# nvcc читается при сборке (версия CUDA API), сам драйвер грузится в рантайме.
makedepends = ["cuda"]

[package.metadata.syngui.release]
artifacts = ["tar-x86_64"]

[package.metadata.android]
package = "com.syngui.synthos"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35

[profile.release]
debug = false
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"

# Быстрая release-сборка для итераций: жертвуем 5-15% runtime ради 3-5×
# ускорения линковки. Использовать: `cargo build --profile fast-release`.
[profile.fast-release]
inherits = "release"
codegen-units = 256
lto = false
incremental = true

[[bin]]
name = "agent_smoke"
path = "src/bin/agent_smoke.rs"

# Крейты synshell (synassist, synaptixd, synmedia…) берут syngui и synaptix git-зависимостями с GitHub;
# подменить их здешними рабочими копиями — иначе в сборке две копии syngui (типы виджетов не сходятся).

[patch."https://github.com/VitaminDB/syngui.git"]
syngui = { path = "../syngui/syngui" }
mss-analysis = { path = "../syngui/mss-analysis" }

[patch."https://github.com/VitaminDB/synaptix.git"]
synaptix = { path = "../synaptix/crates/synaptix" }
synaptix-core = { path = "../synaptix/crates/synaptix-core" }
synaptix-bundle = { path = "../synaptix/crates/synaptix-bundle" }
synaptix-vfx = { path = "../synaptix/crates/synaptix-vfx" }
synaptix-kernels-cpu = { path = "../synaptix/crates/synaptix-kernels-cpu" }
synaptix-kernels-cuda = { path = "../synaptix/crates/synaptix-kernels-cuda" }
synaptix-kernels-npu = { path = "../synaptix/crates/synaptix-kernels-npu" }
synaptix-asr-wav2vec2 = { path = "../synaptix/crates/synaptix-models/asr/wav2vec2" }
synaptix-align-mfa = { path = "../synaptix/crates/synaptix-models/align/mfa" }
synaptix-tts-omnivoice = { path = "../synaptix/crates/synaptix-models/tts/omnivoice" }
synaptix-tts-vibevoice = { path = "../synaptix/crates/synaptix-models/tts/vibevoice" }
synaptix-tts-voxcpm = { path = "../synaptix/crates/synaptix-models/tts/voxcpm" }
synaptix-llm-common = { path = "../synaptix/crates/synaptix-models/llm/common" }
synaptix-gen = { path = "../synaptix/crates/synaptix-gen" }
synaptix-io = { path = "../synaptix/crates/synaptix-io" }
synaptix-audio = { path = "../synaptix/crates/synaptix-audio" }
