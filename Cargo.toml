[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Alexeyev Vitaly"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
toml = "0.8"
safetensors = "0.7"
tokenizers = "0.23.1"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
sqlite-vec = "0.1"

[package]
name = "synthos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local AI desktop studio — node-based video/audio/music/image generation and chat on the native synaptix engine"
repository = "https://github.com/VitaminDB/synthos"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "synthos"
path = "src/main.rs"

[features]
default = ["desktop", "nvml", "kb-sqlite-vec", "gguf"]
desktop = ["syngui/clipboard"]
android = ["syngui/android"]
testing = ["syngui/testing"]
# NVML — GPU/VRAM-метрики на NVIDIA. На не-NVIDIA модуль gpu.rs остаётся
# собранным, но `try_new_nvml()` вернёт None → панель скрывается.
nvml = ["dep:nvml-wrapper"]

gguf = ["dep:synaptix-gguf"]
# sqlite-vec (vec0 virtual table) — KNN-индекс при коллекциях >100k чанков.
# Подключается через `kb::store::init_sqlite_vec()` (one-shot, регистрирует
# auto-extension). Без фичи KB продолжает работать на full-scan-cosine.
kb-sqlite-vec = ["dep:sqlite-vec"]

# doc-парсинг для KB — маркеры синхронны с synaptix-rag (cfg-gating в kb::ingest).
doc-processing-folder = ["synaptix-rag/doc-processing-folder"]
doc-processing-html = ["synaptix-rag/doc-processing-html"]
doc-processing-pdf = ["synaptix-rag/doc-processing-pdf"]

[dependencies]
syngui = { path = "../syngui/syngui", default-features = false, features = [
    "msdf",
    "effects",
    "winit",
    "wayland-dnd",
    # Системное оформление: light/dark и акцент из XDG-портала, кнопки окна из
    # темы декораций, размытие фона композитором.
    "system-theme",
    "system-blur",
    "material-icons",
    "tokio",
    "markdown",
    "markdown-syntax",
    "image",
    "image-network",
    # Цветные эмодзи — иконки страниц заметок.
    "color-emoji",
    "svg",
    "clipboard",
    "audio",
    "ffmpeg",
    "terminal",
    "code-editor-all",
    # WYSIWYG-редактор блочных документов — режим «Заметки».
    "document-editor",
    "i18n",
] }

rand = "0.8"
hound = { workspace = true }
symphonia = { workspace = true }
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
# `env-filter` — позволяет переменной RUST_LOG динамически переопределить
# уровень. `ansi` — цвета в stderr (в файл выводим без ANSI).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
    "registry",
    "std",
] }
# Rolling file appender + non-blocking writer. Daily ротация в
# ~/.local/state/synthos/logs/synthos.log.<YYYY-MM-DD>; чтобы writer не
# блокировал hot-path при tracing! на slow filesystem — non-blocking
# (отдельный std::thread, batch flush'ит в фоне).
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frontmatter в файлах скилов (`~/.config/synthos/skills/*.md`).
toml = { workspace = true }
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }

synaptix-core = { path = "../synaptix/crates/synaptix-core" }
synaptix-video-ltx23 = { path = "../synaptix/crates/synaptix-models/video/ltx23" }
synaptix-video-minimax-h3 = { path = "../synaptix/crates/synaptix-models/video/minimax_h3" }
synaptix-llm-gemma3 = { path = "../synaptix/crates/synaptix-models/llm/gemma3" }
synaptix-kernels-cpu = { path = "../synaptix/crates/synaptix-kernels-cpu" }
synaptix-kernels-cuda = { path = "../synaptix/crates/synaptix-kernels-cuda" }
# synaptix-io (feature image) — load_image/resize_bilinear для LTX Image ноды
# (image→video conditioning), canny_rgb для IC-LoRA control.
synaptix-io = { path = "../synaptix/crates/synaptix-io", default-features = false, features = ["image"] }
# Depth Anything V2 — depth-map control-сигнал для LTX IC-LoRA ноды.
synaptix-depth-anything = { path = "../synaptix/crates/synaptix-models/image/depth_anything", default-features = false }
# Нативный synaptix-порт VoxCPM2 для TTS-ноды (node_editor/nodes/voxcpm2).
synaptix-tts-voxcpm = { path = "../synaptix/crates/synaptix-models/tts/voxcpm", default-features = false }
# Нативный synaptix-порт VibeVoice — многоголосый длинный синтез
# (node_editor/nodes/vibevoice). audio-decode нужен для mp3/ogg/flac-референсов.
synaptix-tts-vibevoice = { path = "../synaptix/crates/synaptix-models/tts/vibevoice" }

# Нативный synaptix-порт ACE-Step v1.5 (node_editor/nodes/acestep). Backend-
# агностичен: считает на зарегистрированном synaptix-kernels-{cpu,cuda}.
synaptix-music-acestep = { path = "../synaptix/crates/synaptix-models/music/acestep" }

# Нативный synaptix-LLM-стек для LLM-ноды (node_editor/nodes/llm). qwen3 —
# dense/MoE Qwen3, qwen3-next-hybrid — GatedDeltaNet+full-attn (model_type
# qwen3_next/5/6); common — GenerationConfig/StreamSink; tokenizer —
# ChatTemplate/SpecialTokens; bundle — детект арх из .syn (config.json).
synaptix-llm-qwen3 = { path = "../synaptix/crates/synaptix-models/llm/qwen3", default-features = false }
synaptix-llm-qwen3-next-hybrid = { path = "../synaptix/crates/synaptix-models/llm/qwen3_next_hybrid", default-features = false }
synaptix-llm-common = { path = "../synaptix/crates/synaptix-models/llm/common", default-features = false }
synaptix-tokenizer = { path = "../synaptix/crates/synaptix-tokenizer" }
# sha256/blake3 — контрольные суммы чанков, доступные в режиме эксперта
# на странице пакетов (`with_sha256`/`with_blake3` без фич паникуют).
synaptix-bundle = { path = "../synaptix/crates/synaptix-bundle", features = ["sha256", "blake3"] }
synaptix-gguf = { path = "../synaptix/crates/synaptix-gguf", optional = true }

# Зонтичный фасад synaptix — единые фасады AI-подсистем (facade::llm/asr/
# embedding/rerank/diarization/tts) с детекцией архитектуры. Заменяет прежний
# слой адаптеров.
synaptix = { path = "../synaptix/crates/synaptix", default-features = false }
# synaptix-rag — doc-парсинг (md/html/pdf) + chunking + gitignore-walk для KB
# (модуль `doc`). sqlite-vec не включаем: индекс KB на собственном synthos-стеке.
synaptix-rag = { path = "../synaptix/crates/synaptix-rag", default-features = false }

# safetensors — для парсинга `silence_latent.safetensors` из ACE-Step .syn
# bundle (lazy mmap через bundle.read_file). См. shared.rs::load_silence_from_bundle.
safetensors.workspace = true

# HTTP-клиент к llama-server (llama::api)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
    "multipart",
] }
tokio = { version = "1", features = [
    "rt",
    "time",
    "macros",
    "sync",
    "process",
    "io-util",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
anyhow = { workspace = true }
bytes = "1"

# Конвертация HTML → Markdown для tool'а web (action=read). На html5ever,
# GFM-таблицы и code-блоки из коробки. Активно поддерживается, превосходит
# html2md по качеству вывода.
htmd = "0.5"

# Mozilla Readability port (pure Rust). Используется в tool web (action=read)
# для извлечения article-контента из HTML до конвертации в markdown:
# вырезает nav/footer/sidebar/реклама.
dom_smoothie = "0.16"

# CSS-селекторы по DOM (на html5ever) — парсинг SERP DuckDuckGo
# в tool web (action=search).
scraper = "0.20"

# URL — нужен для unwrap DDG-обёрток `/l/?uddg=…` (parse + query_pairs).
url = "2"

# Кодирование query-string в URL поиска DDG.
urlencoding = "2"

# Multimodal attachments: sha256-CAS в blobs/, base64 для data: URL.
sha2 = "0.10"
base64 = "0.22"
# Для guess MIME картинки по байтам — переиспользуем уже подключённый image
# через syngui features (cdylib), но прямого доступа из synthos нет. Берём
# отдельно: легковесный.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }

# Системные метрики для панели «Детали» (CPU per-thread, RAM).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# File system watcher — детект внешних изменений в проектах редактора кода
# (git pull, другой редактор). Используется в `pages::code_editor::fs_watcher`.
# `macos_kqueue=false` — на macOS используется FSEvents (default).
notify = { version = "8", default-features = false, features = [
    "macos_fsevent",
] }

# Pure-Rust git: используется страницей `pages::code_editor::git_status`
# для подсветки изменённых/новых/удалённых файлов в TreeView (Zed-style
# decorations). default-features off — нам не нужен networking; явно
# включаем `sha1` (gix-hash требует hash-backend) и `status`-API (даёт
# `Repository::status()` итератор и под него dirwalk + index + diff).
gix = { version = "0.83", default-features = false, features = [
    "sha1",
    "status",
] }
# NVIDIA GPU/VRAM метрики. Опциональная — если библиотеки нет в системе,
# на рантайме `Nvml::init()` вернёт Err и модуль деградирует молча.
nvml-wrapper = { version = "0.10", optional = true }

# Локальное хранилище для KB-индексов (см. src/kb/store.rs). bundled — статически
# линкуется sqlite (без системной зависимости). blob — для сериализации
# embedding-векторов как BLOB. fts5 — встроен в bundled-sqlite.
rusqlite = { workspace = true }

# vec0 virtual table для KB при коллекциях >100k чанков. Опционально через
# feature `kb-sqlite-vec`. Подключается через `init_sqlite_vec()` в lib.rs
# (one-shot, sqlite3_auto_extension). См. src/kb/vector_index.rs.
sqlite-vec = { workspace = true, optional = true }

# HF tokenizers — для chunker'а в kb::ingest. Тот же крейт уже тянет
# embedding-модель через synaptix KB, поэтому компилируется один раз.
tokenizers = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
tempfile = "3.10"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
package = "com.syngui.synthos"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35

[profile.release]
debug = false
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"

# Быстрая release-сборка для итераций: жертвуем 5-15% runtime ради 3-5×
# ускорения линковки. Использовать: `cargo build --profile fast-release`.
[profile.fast-release]
inherits = "release"
codegen-units = 256
lto = false
incremental = true

# Проверка квантующей упаковки без GUI: собирает бандл и сверяет раскладку.
[[bin]]
name = "quant_pack_smoke"
path = "src/bin/quant_pack_smoke.rs"
